<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 700" width="320" height="700">

  <!-- cream background -->
  <rect width="320" height="700" fill="#F7F1E8"/>

  <!-- receipt body -->
  <rect x="30" y="22" width="260" height="656"
        fill="#FBF8F1" stroke="#E8D9C1" stroke-width="1"/>

  <!-- decorative leaf top center -->
  <g transform="translate(160, 60)">
    <ellipse cx="-9" cy="-2" rx="10" ry="4" fill="#7A9968" transform="rotate(-25)"/>
    <ellipse cx="9" cy="-2" rx="10" ry="4" fill="#8FAA75" transform="rotate(25)"/>
    <line x1="0" y1="-8" x2="0" y2="6" stroke="#6B4E2E" stroke-width="1"/>
  </g>

  <!-- logo: ROOT BEAN (2 lines, serif) -->
  <text x="160" y="115" font-family="Georgia, serif"
        font-size="26" font-weight="700"
        fill="#6B4E2E" letter-spacing="2"
        text-anchor="middle">ROOT</text>
  <text x="160" y="145" font-family="Georgia, serif"
        font-size="26" font-weight="700"
        fill="#6B4E2E" letter-spacing="2"
        text-anchor="middle">BEAN</text>
  <text x="160" y="168" font-family="Helvetica, sans-serif"
        font-size="9" letter-spacing="3"
        fill="#A67C52" text-anchor="middle">COFFEE &amp; BAKERY</text>

  <!-- top dashed -->
  <line x1="50" y1="195" x2="270" y2="195"
        stroke="#A67C52" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- meta info -->
  <g font-family="Helvetica, sans-serif" font-size="11" fill="#355E3B">
    <text x="50" y="220" fill="#6B4E2E">Order No.</text>
    <text x="270" y="220" text-anchor="end">#RB240507</text>
    <text x="50" y="240" fill="#6B4E2E">Date</text>
    <text x="270" y="240" text-anchor="end">27/04/2026 10:20</text>
    <text x="50" y="260" fill="#6B4E2E">Cashier</text>
    <text x="270" y="260" text-anchor="end">Barista Aom</text>
  </g>

  <line x1="50" y1="280" x2="270" y2="280"
        stroke="#A67C52" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- header row -->
  <g font-family="Helvetica, sans-serif" font-size="10" font-weight="700" fill="#6B4E2E" letter-spacing="1.5">
    <text x="50" y="302">ITEM</text>
    <text x="270" y="302" text-anchor="end">PRICE</text>
  </g>

  <line x1="50" y1="313" x2="270" y2="313"
        stroke="#A67C52" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- items -->
  <g font-family="Helvetica, sans-serif" font-size="14" fill="#355E3B">
    <text x="50" y="338">Latte</text>
    <text x="270" y="338" text-anchor="end">฿120</text>
    <text x="50" y="362">Croissant</text>
    <text x="270" y="362" text-anchor="end">฿95</text>
  </g>

  <line x1="50" y1="380" x2="270" y2="380"
        stroke="#A67C52" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- summary -->
  <g font-family="Helvetica, sans-serif" font-size="11" fill="#6B4E2E" letter-spacing="0.8">
    <text x="50" y="404">SUBTOTAL</text>
    <text x="270" y="404" text-anchor="end" fill="#355E3B" letter-spacing="0">฿215</text>
    <text x="50" y="424">DISCOUNT</text>
    <text x="270" y="424" text-anchor="end" fill="#355E3B" letter-spacing="0">-฿0</text>
    <text x="50" y="444">TAX (7%)</text>
    <text x="270" y="444" text-anchor="end" fill="#355E3B" letter-spacing="0">฿15</text>
  </g>

  <!-- total box (double border) -->
  <rect x="40" y="468" width="240" height="58" fill="none"
        stroke="#6B4E2E" stroke-width="2" rx="6"/>
  <rect x="44" y="472" width="232" height="50" fill="none"
        stroke="#6B4E2E" stroke-width="0.5" rx="4"/>

  <text x="58" y="504" font-family="Georgia, serif"
        font-size="20" font-weight="700"
        fill="#355E3B" letter-spacing="1">TOTAL</text>
  <text x="262" y="506" font-family="Georgia, serif"
        font-size="26" font-weight="700"
        fill="#355E3B" text-anchor="end">฿230</text>

  <!-- payment -->
  <g font-family="Helvetica, sans-serif" font-size="10" fill="#6B4E2E" letter-spacing="0.5">
    <text x="50" y="555">PAYMENT METHOD</text>
    <text x="50" y="575" font-size="13" fill="#355E3B" letter-spacing="0">Cash</text>
    <text x="270" y="575" font-size="13" fill="#355E3B" text-anchor="end">฿230</text>
  </g>

  <!-- thank you (cursive script) -->
  <text x="148" y="618" font-family="Brush Script MT, cursive"
        font-size="28" fill="#355E3B" text-anchor="middle"
        font-style="italic">thank you</text>

  <!-- heart icon (vector path, ไม่พึ่ง font) -->
  <path d="M 218 612
           C 216 608, 211 608, 211 614
           C 211 608, 206 608, 204 612
           C 202 615, 211 624, 211 624
           C 211 624, 220 615, 218 612 Z"
        fill="#355E3B"/>

  <text x="160" y="640" font-family="Helvetica, sans-serif"
        font-size="9" fill="#6B4E2E" letter-spacing="3"
        text-anchor="middle">• HAVE A NICE DAY •</text>

  <!-- bottom leaf -->
  <g transform="translate(160, 655)">
    <path d="M -7 0 Q -5 -5 0 -7 Q 5 -5 7 0 Q 5 5 0 4 Q -5 5 -7 0 Z"
          fill="#7A9968" opacity="0.7"/>
    <line x1="0" y1="-2" x2="0" y2="5" stroke="#6B4E2E" stroke-width="0.6"/>
  </g>

  <!-- branding -->
  <text x="160" y="672" font-family="Helvetica, sans-serif"
        font-size="8" fill="#A67C52" letter-spacing="1.5"
        text-anchor="middle">Made with SLIPKIT — bearalot.com</text>
</svg>
